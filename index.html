<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kun Asatoura</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#0a3d0a;font-family:Arial;overflow:hidden;height:100vh}
#game{position:relative;width:100%;height:100vh;background:linear-gradient(#1a6e1a,#0a3d0a)}
#top{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,0.7);color:white}
#player{position:absolute;left:40%;top:45%;width:60px;height:80px;background:#1a4dff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:30px}
#ball{position:absolute;left:48%;top:60%;width:20px;height:20px;background:white;border-radius:50%}
#joy{position:absolute;left:20px;bottom:20px;width:110px;height:110px;background:rgba(0,0,0,0.3);border:2px solid #fff6;border-radius:50%}
#joyInner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:#fff8;border-radius:50%}
#btns{position:absolute;right:15px;bottom:15px;display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;border:3px solid #0009}
#shoot{width:95px;height:95px;background:#e53935}
#sprint{width:85px;height:85px;background:#ffeb3b;color:black}
#pass{width:85px;height:85px;background:#1e88e5}
.row{display:flex;gap:10px}
</style></head><body>
<div id="game">
<div id="top"><div>72:15 | BLUES 1-0 REDS</div><div>PAUSE</div></div>
<div id="player">9</div><div id="ball"></div>
<div id="joy"><div id="joyInner"></div></div>
<div id="btns"><div class="btn" id="shoot">SHOOT</div><div class="row"><div class="btn" id="sprint">SPRINT</div><div class="btn" id="pass">PASS</div></div></div>
</div>
<script>
let px=40,py=45,bx=48,by=60,mx=0,my=0,sprint=false;
const p=document.getElementById('player'),b=document.getElementById('ball'),ji=document.getElementById('joyInner'),joy=document.getElementById('joy');
function upd(){p.style.left=px+'%';p.style.top=py+'%';b.style.left=bx+'%';b.style.top=by+'%';}
joy.addEventListener('touchmove',e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,t=e.touches[0];let dx=t.clientX-cx,dy=t.clientY-cy,md=40,d=Math.sqrt(dx*dx+dy*dy);if(d>md){dx=dx/d*md;dy=dy/d*md;}ji.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;mx=dx/md;my=dy/md;});
joy.addEventListener('touchend',()=>{ji.style.transform='translate(-50%,-50%)';mx=0;my=0;});
(function loop(){if(mx||my){let s=sprint?0.8:0.4;px+=mx*s;py+=my*s;bx+=mx*s;by+=my*s;upd();}requestAnimationFrame(loop);})();
document.getElementById('sprint').ontouchstart=()=>sprint=true;document.getElementById('sprint').ontouchend=()=>sprint=false;
document.getElementById('pass').ontouchstart=()=>{bx+=mx*5||5;upd();setTimeout(()=>{bx=px+3;upd();},300);};
document.getElementById('shoot').ontouchstart=()=>{bx=90;by=48;upd();setTimeout(()=>{bx=px+3;by=py+5;upd();alert('GOAL! مروان 9');},500);};
</script></body></html>
